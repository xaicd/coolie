name: e2e: agent-device replay (iOS)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  replay-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install repo dependencies
        run: pnpm install --frozen-lockfile

      - name: Install agent-device CLI
        run: npm install -g agent-device@latest

      - name: Open Simulator app
        run: |
          open -a Simulator || true

      - name: Ensure simulator available
        env:
          SIM_NAME: "iPhone 14"
        run: |
          xcrun simctl list devices
          # Boot the simulator if not booted
          xcrun simctl boot "$SIM_NAME" || true
          # Wait until booted
          n=0
          until xcrun simctl getenv booted SIMULATOR_RUNTIME 2>/dev/null || [ $n -gt 30 ]; do
            sleep 2
            n=$((n+1))
          done

      - name: Prebuild iOS (Expo managed -> native)
        working-directory: clients/expo
        run: |
          # If using bare/native iOS, skip this step. For Expo managed, prebuild creates ios/ Xcode project.
          npx expo prebuild --platform ios --no-install || true

      - name: Build iOS simulator app
        working-directory: clients/expo
        env:
          # Adjust these if your scheme/workspace differ
          WORKSPACE: ios/Coolie.xcworkspace
          SCHEME: Coolie
          SIMULATOR: 'iPhone 14'
        run: |
          # Build for the iOS simulator
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphonesimulator -configuration Debug -destination "platform=iOS Simulator,name=$SIMULATOR" BUILD_DIR=build clean build

      - name: Find built .app
        working-directory: clients/expo
        run: |
          APP_PATH=$(find build -name "*.app" | head -n 1 || true)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          if [ -z "$APP_PATH" ]; then
            echo "Built .app not found. Adjust workspace/scheme or prebuild steps." && exit 1
          fi

      - name: Install app on simulator
        working-directory: clients/expo
        run: |
          echo "Installing ${{ steps.find_built_app.outputs.app_path }}"
          xcrun simctl install booted $(find build -name "*.app" | head -n 1)

      - name: Wait for device
        run: xcrun simctl bootstatus booted -b

      - name: Run agent-device replay
        working-directory: clients/expo
        env:
          # Optional: set AGENT_DEVICE_DAEMON_BASE_URL to target remote daemon
          # AGENT_DEVICE_DAEMON_BASE_URL: ${{ secrets.AGENT_DEVICE_DAEMON_BASE_URL || '' }}
        run: |
          mkdir -p ../evidence || true
          # Ensure replay script path exists in repo (adjust path if needed)
          REPLAY=./replays/coolie-flow.ad
          if [ ! -f "$REPLAY" ]; then
            echo "Replay script $REPLAY not found — ensure you committed it." && exit 1
          fi
          agent-device replay "$REPLAY" --session ci-e2e-ios --keep-session || echo "replay command exited with non-zero"

      - name: Collect simulator logs and artifacts
        working-directory: clients/expo
        run: |
          mkdir -p ../../artifacts/agent-device || true
          # copy evidence directories that scripts produce (adjust as needed)
          cp -R ./evidence ../../artifacts/agent-device || true
          # capture system logs
          xcrun simctl get_log booted > ../../artifacts/agent-device/simulator.log || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-device-evidence-ios
          path: |
            artifacts/agent-device
            clients/expo/replays

name: e2e: agent-device replay (iOS)

# Manual only, deliberately.
#
# This job could never pass on its own triggers, and it never has:
#   - the replay script (clients/expo/replays/coolie-flow.ad) is a starter that opens
#     the Expo devtools URL in a browser; it does not drive the app, and nothing here
#     starts a dev server for it to open;
#   - the build failed before that, because `clients/expo` is not a pnpm workspace
#     member, so the root `pnpm install` never installed `expo` for `expo prebuild`;
#     `|| true` hid exactly that, and the swallowed replay failure hid the rest.
#
# So it is kept runnable on purpose (workflow_dispatch) and honest about what it does
# and does not prove. Re-enabling per-push triggers requires a replay script that
# actually exercises the app, and a green run of this job.
on:
  workflow_dispatch:

jobs:
  replay-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install repo dependencies
        run: pnpm install --frozen-lockfile

      # clients/expo is not a workspace member (see clients/README.md): it has its own
      # lockfile and installs standalone, with dev dependencies, because the hoisted
      # linker and babel-preset-expo are needed to prebuild.
      - name: Install app dependencies
        working-directory: clients/expo
        env:
          NODE_ENV: development
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Install agent-device CLI
        run: npm install -g agent-device@latest

      - name: Open Simulator app
        run: open -a Simulator

      - name: Ensure simulator available
        env:
          SIM_NAME: "iPhone 14"
        run: |
          xcrun simctl list devices
          xcrun simctl boot "$SIM_NAME" || true
          n=0
          until xcrun simctl getenv booted SIMULATOR_RUNTIME 2>/dev/null || [ $n -gt 30 ]; do
            sleep 2
            n=$((n+1))
          done

      - name: Prebuild iOS (Expo managed -> native)
        working-directory: clients/expo
        run: |
          # No `|| true`: a prebuild that fails must fail this job, since every later
          # step depends on the Xcode project it produces. Pods are installed here so
          # the .xcworkspace that xcodebuild needs actually exists.
          npx expo prebuild --platform ios

      - name: Build iOS simulator app
        working-directory: clients/expo
        env:
          WORKSPACE: ios/Coolie.xcworkspace
          SCHEME: Coolie
          SIMULATOR: 'iPhone 14'
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphonesimulator -configuration Debug -destination "platform=iOS Simulator,name=$SIMULATOR" BUILD_DIR=build clean build

      - name: Find built .app
        id: find_built_app
        working-directory: clients/expo
        run: |
          APP_PATH=$(find build -name "*.app" | head -n 1 || true)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          if [ -z "$APP_PATH" ]; then
            echo "Built .app not found. Adjust workspace/scheme or prebuild steps." && exit 1
          fi

      - name: Install app on simulator
        working-directory: clients/expo
        run: |
          echo "Installing ${{ steps.find_built_app.outputs.app_path }}"
          xcrun simctl install booted "${{ steps.find_built_app.outputs.app_path }}"

      - name: Wait for device
        run: xcrun simctl bootstatus booted -b

      - name: Run agent-device replay
        working-directory: clients/expo
        run: |
          mkdir -p ../evidence
          REPLAY=./replays/coolie-flow.ad
          if [ ! -f "$REPLAY" ]; then
            echo "Replay script $REPLAY not found — ensure you committed it." && exit 1
          fi
          # No `|| echo`: a replay that fails must fail this job. Note what the current
          # script does — it opens the devtools URL in a browser, so it exercises the
          # app not at all; see the header of this file.
          agent-device replay "$REPLAY" --session ci-e2e-ios --keep-session

      - name: Collect simulator logs and artifacts
        working-directory: clients/expo
        run: |
          mkdir -p ../../artifacts/agent-device || true
          cp -R ./evidence ../../artifacts/agent-device || true
          xcrun simctl get_log booted > ../../artifacts/agent-device/simulator.log || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-device-evidence-ios
          path: |
            artifacts/agent-device
            clients/expo/replays

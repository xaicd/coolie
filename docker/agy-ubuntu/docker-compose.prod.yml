services:
  agy-box:
    image: chw717/ai-agy:latest
    container_name: agy-ubuntu-container
    restart: always

    environment:
      TZ: Asia/Shanghai
      CLASH_URL: ${CLASH_URL:-}

    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - ./workspace:/root/workspace
      - ./agy-home:/root/.gemini
      - ./claude-home:/root/.claude
      - ${HOME}/.gitconfig:/root/.gitconfig-host:ro
      - ${HOME}/.ssh:/root/.ssh-host:ro
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./mihomo-conf/proxies-static.yaml:/root/.config/mihomo/proxies-static.yaml:ro

    stdin_open: true
    tty: true

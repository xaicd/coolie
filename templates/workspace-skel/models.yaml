# models.yaml — 5 角色主备 CLI / 模型映射（workspace 骨架）
#
# primary: 首选 CLI 与模型；backup: 主不可用时的降级目标。
# pacing: 同一 GLM 池内的串行约束（避免并发争抢同一额度）。
version: 1
roles:
  fda:
    cli: cmd
    model: glm-5.3
    backup:
      cli: claude
      model: claude-sonnet-4-5
  core-swe:
    cli: cmd
    model: glm-5.3
    backup:
      cli: claude
      model: claude-sonnet-4-5
  pre-sre:
    cli: claude
    model: claude-sonnet-4-5
    backup:
      cli: cmd
      model: glm-5.3
  fdse:
    cli: claude
    model: claude-sonnet-4-5
    backup:
      cli: cmd
      model: glm-5.3
  ds:
    cli: claude
    model: claude-opus-4-5
    backup:
      cli: cmd
      model: glm-5.3
pacing:
  glm_pool_serial: true
